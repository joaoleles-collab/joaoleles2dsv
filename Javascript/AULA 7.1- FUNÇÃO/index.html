<!DOCTYPE html> 
<html lang='pt-br'> 
<head> 
    <meta charset='UTF-8'> 
    <title>      Festival de Filmes</title> 
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' 
          rel='stylesheet'> 
</head> 
<body> 
    <nav class='navbar navbar-dark bg-dark px-4'> 
        <span class='navbar-brand'>      Festival de Filmes</span> 
    </nav> 
 
    <div class='container mt-4'> 
        <div class='row justify-content-center'> 
            <div class='col-md-5 card p-4 shadow'> 
                <h4 class='mb-3'>Calcular Ingresso</h4> 
 
                <label class='form-label'>Seu nome:</label> 
                <input id='nome' class='form-control mb-3' type='text' 
                       placeholder='Ex: João'> 
 
                <label class='form-label'>Ano de nascimento:</label> 
                <input id='ano' class='form-control mb-3' 
                       type='number' placeholder='Ex: 2008'> 
 
                <button class='btn btn-primary w-100' 
                        onclick='calcular()'> 
                    Calcular 
                </button> 
            </div> 
        </div> 
        <div id='resultado' class='mt-4'></div> 
    </div> 
<script src='script/script.js'></script> 
</body> 
</html>
