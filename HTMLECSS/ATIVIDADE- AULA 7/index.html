<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salário Família</title>
    <link rel="stylesheet" href="styles/index.css">
</head>

<body>
    <main>
        <div id="banner">

        </div>


        <form action="#">
            
            
            <div class="formSalario">
                <label for="empregado"></label>
                <input id="empregado" type="text" placeholder="Empregado">

            </div>

            <div class="formSalario">
                <label for="quantidade"></label>
                <input id="quantidade" type="number" placeholder="Quantidade de filhos menores 14 anos ou inválidos"
                    min="0" max="100" step="1">
            </div>

            <div class="formSalario">
                <label for="salário"></label>
                <input id="salário" type="number" placeholder="Salário Contribuição" min="0">
            </div>

            <div id="Partes">

                <div class="parteEsquerda">
                    <div class="tabela1">Salário-contribuição</div>
                    <div class="tabela">Até R$806,80</div>
                    <div class="tabela">Entre R$806,81 e R$1212,64</div>
                    <div class="tabela">Mais de R$1212,64</div>
                </div>

                <div class="parteDireita">
                    <div class="tabela1">Cota do salário família</div>
                    <div class="tabela">R$ 41,37 por filho</div>
                    <div class="tabela">R$ 29,16 por filho</div>
                    <div class="tabela">Não há</div>






                </div>

            </div>

            <button type="submit">Calcular</button>

        </form>
    </main>

</body>

</html>
